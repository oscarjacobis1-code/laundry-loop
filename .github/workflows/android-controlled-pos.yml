name: Android POS controlled APK

on:
  pull_request:
    paths:
      - "android-print-bridge/**"
      - "app/api/pos-access/**"
      - ".github/workflows/android-controlled-pos.yml"
  push:
    branches: [main]
    paths:
      - "android-print-bridge/**"
      - ".github/workflows/android-controlled-pos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Android POS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build commissioning APK
        working-directory: android-print-bridge
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload commissioning APK
        uses: actions/upload-artifact@v4
        with:
          name: laundry-loop-pos-2.3-remote-control-debug
          path: android-print-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Build signed release if keys are available
        working-directory: android-print-bridge
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Release signing not configured: only the debug APK was built."
            exit 0
          fi
          mkdir -p signing
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > signing/release.jks
          export ANDROID_KEYSTORE_PATH="$PWD/signing/release.jks"
          gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Upload signed APK when available
        uses: actions/upload-artifact@v4
        with:
          name: laundry-loop-pos-2.3-remote-control-signed
          path: android-print-bridge/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 30
