name: Build Android Print Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/android-pos-print-bridge
      - feature/offline-pos-apk
      - security/harden-pos-gate
    paths:
      - 'android-print-bridge/**'
      - '.github/workflows/build-android-print-bridge.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-print-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate SnapNest launcher icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d app/src/main/snapnest_launcher.b64 > app/src/main/res/drawable/snapnest_launcher.png

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: laundry-loop-pos-debug
          path: android-print-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
