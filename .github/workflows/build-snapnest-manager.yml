name: Build SnapNest Manager

on:
  workflow_dispatch:
  push:
    branches:
      - snapnest-manager-v1
    paths:
      - 'android-snapnest-manager/**'
      - '.github/workflows/build-snapnest-manager.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-snapnest-manager
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snapnest-manager-debug
          path: android-snapnest-manager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
