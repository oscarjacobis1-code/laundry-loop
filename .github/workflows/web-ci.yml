name: Web CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'public/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'netlify.toml'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production site
        run: npm run build
